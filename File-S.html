<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeleNative - Lossless Web Messenger</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --sidebar-bg: #1e293b;
      --chat-bg: #0f172a;
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-out: #0369a1;
      --msg-in: #334155;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar Layout */
    .sidebar {
      width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(56, 189, 248, 0.1);
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-name {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .chat-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Chat View */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--chat-bg);
    }

    .chat-header {
      padding: 16px 24px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .messages-container {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 65%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
    }

    .message.outgoing {
      align-self: flex-end;
      background: var(--msg-out);
      border-bottom-right-radius: 2px;
    }

    .message.incoming {
      align-self: flex-start;
      background: var(--msg-in);
      border-bottom-left-radius: 2px;
    }

    .message-meta {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      text-align: right;
    }

    /* Media & Attachment Styles */
    .media-card {
      margin-top: 6px;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(0,0,0,0.2);
    }

    .media-card img {
      max-width: 100%;
      max-height: 350px;
      display: block;
      object-fit: contain;
      cursor: pointer;
    }

    .media-badge {
      display: inline-block;
      padding: 2px 6px;
      background: rgba(0,0,0,0.5);
      font-size: 0.75rem;
      border-radius: 4px;
      margin-top: 4px;
      color: #38bdf8;
    }

    .file-attachment {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
    }

    .file-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
    }

    /* Input Bar */
    .input-bar {
      padding: 16px 24px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .input-bar input[type="text"] {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 20px;
      color: var(--text-main);
      outline: none;
    }

    .input-bar input[type="text"]:focus {
      border-color: var(--accent);
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }

    .action-btn:hover {
      color: var(--accent);
      background: rgba(255,255,255,0.05);
    }

    .send-btn {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      ⚡ TeleNative
    </div>
    <div class="chat-list">
      <div class="chat-item active">
        <div class="avatar">CC</div>
        <div class="chat-info">
          <div class="chat-name">Cloud Storage / Self</div>
          <div class="chat-preview">Send uncompressed files & images...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Main Area -->
  <div class="chat-area">
    <div class="chat-header">
      <div>
        <div class="chat-name">Cloud Storage / Lossless Drop</div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Original Quality Pipeline Active</div>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="messages-container" id="messageStream">
      <div class="message incoming">
        Welcome to TeleNative! Images dropped here bypass canvas compression to preserve full bit-rate and EXIF metadata.
        <div class="message-meta">System • Just now</div>
      </div>
    </div>

    <!-- Controls Input -->
    <div class="input-bar">
      <!-- Uncompressed Image Trigger -->
      <button class="action-btn" title="Send Original Image (Lossless)" onclick="document.getElementById('imageInput').click()">
        🖼️
      </button>
      <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">

      <!-- Large File Trigger -->
      <button class="action-btn" title="Send Large Document/File" onclick="document.getElementById('fileInput').click()">
        📎
      </button>
      <input type="file" id="fileInput" onchange="handleFileUpload(event)">

      <input type="text" id="messageInput" placeholder="Write a message..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendTextMessage()">Send</button>
    </div>
  </div>

  <script>
    const messageStream = document.getElementById('messageStream');
    const messageInput = document.getElementById('messageInput');

    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage(contentNode, isOutgoing = true) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
      
      msgDiv.appendChild(contentNode);

      const metaDiv = document.createElement('div');
      metaDiv.className = 'message-meta';
      metaDiv.innerText = getCurrentTime();
      msgDiv.appendChild(metaDiv);

      messageStream.appendChild(msgDiv);
      messageStream.scrollTop = messageStream.scrollHeight;
    }

    function sendTextMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      const span = document.createElement('span');
      span.innerText = text;

      appendMessage(span, true);
      messageInput.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendTextMessage();
      }
    }

    /**
     * Lossless Image Handling:
     * Reads directly from the raw File/Blob stream without using <canvas> 
     * re-encoding, preserving exact original file bytes and resolution.
     */
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const container = document.createElement('div');

      const img = document.createElement('img');
      const objectUrl = URL.createObjectURL(file);
      img.src = objectUrl;

      const mediaCard = document.createElement('div');
      mediaCard.className = 'media-card';
      mediaCard.appendChild(img);

      // Inspect resolution dynamically once loaded
      img.onload = () => {
        const badge = document.createElement('div');
        badge.className = 'media-badge';
        badge.innerText = `RAW • ${img.naturalWidth}x${img.naturalHeight}px • ${formatBytes(file.size)}`;
        container.appendChild(mediaCard);
        container.appendChild(badge);
        appendMessage(container, true);
      };
      
      e.target.value = ''; // Reset input
    }

    /**
     * File Transfer Handling:
     * Prepares files for chunked byte streaming across network protocols.
     */
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const fileCard = document.createElement('div');
      fileCard.className = 'file-attachment';

      const ext = file.name.split('.').pop().toUpperCase();
      
      fileCard.innerHTML = `
        <div class="file-icon">${ext.slice(0, 4)}</div>
        <div>
          <div style="font-weight: 600;">${file.name}</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">${formatBytes(file.size)}</div>
        </div>
      `;

      appendMessage(fileCard, true);
      e.target.value = ''; // Reset input
    }
  </script>
</body>
</html>
